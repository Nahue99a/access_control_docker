version: "3.9"
services:
  calocal_be:
    image: jcarriquiry/access-control-local-be:v17
    ports:
      - "3888:3888"
    env_file:
      - .env-be
    networks:
      - calocal_network
    restart: always
  calocal_fe:
    image: jcarriquiry/access-control-local-fe:v6
    ports:
      - "8080:8080"
    env_file:
      - .env-fe 
    networks:
      - calocal_network
    restart: always
  lpr:
    image: jcarriquiry/access-control-local-alpr:v2
    ports:
      - "5000:5000"
    networks:
      - calocal_network
    restart: always

networks:
  calocal_network:
    driver: bridge